name: 快冲云
description: 优化快冲云入口访问策略，自动分流并提升连接稳定性。
author: Patatooo
homepage: https://kcyun.org.com
icon: https://favicon.im/www.ltyun.xyz?larger=true&t=1782337722290

rules:
- domain_keyword:
    match: kcyun
    policy: DIRECT


dns:
  bootstrap:
      - 223.5.5.5
  forward:
    - domain:
        match: hk6.org
        value: bootstrap
        disabled: false

    - domain_wildcard:
        match: "*.hk6.org"
        value: bootstrap
        disabled: false