name: 快冲云
description: 优化快冲云入口访问策略，自动分流并提升连接稳定性。
author: Patatooo
homepage: https://kcyun.org
icon: https://dimg04.tripcdn.com/images/0Z05f224x9a88doao7C16.jpg

rules:


dns:
  bootstrap:
      - 223.5.5.5
  forward:
    - domain:
        match: hk6.org
        value: bootstrap
        disabled: false

    - domain_wildcard:
        match: "*.hk6.org"
        value: bootstrap
        disabled: false