#!name=蓝通云
#!desc=指定 hk6.org 域名使用阿里 DNS（223.5.5.5）解析。
#!openUrl=https://ltyun001.com
#!author=Patatooo
#!icon=https://favicon.im/www.ltyun.xyz?larger=true&t=1782337722290
name: 蓝通云
description: 优化蓝通云入口访问策略，自动分流并提升连接稳定性。
author: Patatooo
homepage: https://ltyun001.com
icon: https://favicon.im/www.ltyun.xyz?larger=true&t=1782337722290

rules:
- domain_keyword:
    match: ltyun001
    policy: DIRECT
- domain:
    match: ltyun.org
    policy: PROXY
- domain_suffix:
    match: ltyun.org
    policy: PROXY

dns:
  upstreams:
    蓝通:
      - 223.5.5.5
  forward:
    - domain:
        match: hk6.org
        value: 蓝通
        disabled: false

    - domain_wildcard:
        match: "*.hk6.org"
        value: 蓝通
        disabled: false